name: gh-windows-vps-5

on:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: gh-windows-vps-5
  cancel-in-progress: false

jobs:
  rdp:
    name: Windows RDP (gh-windows-vps-5)
    runs-on: windows-latest
    timeout-minutes: 355
    env:
      RDP_USER: vps
      RDP_PASS: ${{ secrets.RDP_PASS }}
      TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
      TS_HOSTNAME: gh-windows-vps-5

    steps:
      - name: Enable RDP + create login user
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASS))  { throw 'Secret RDP_PASS is empty.' }
          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) { throw 'Secret TS_AUTHKEY is empty.' }

          $user = $env:RDP_USER
          $sec  = ConvertTo-SecureString $env:RDP_PASS -AsPlainText -Force

          if (Get-LocalUser -Name $user -ErrorAction SilentlyContinue) {
            Set-LocalUser -Name $user -Password $sec
          } else {
            New-LocalUser -Name $user -Password $sec -PasswordNeverExpires -AccountNeverExpires -Description 'RDP' | Out-Null
          }
          Add-LocalGroupMember -Group 'Administrators'       -Member $user -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group 'Remote Desktop Users' -Member $user -ErrorAction SilentlyContinue

          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name UserAuthentication -Value 0
          Set-Service -Name TermService -StartupType Automatic
          Start-Service TermService -ErrorAction SilentlyContinue

          if (-not (Get-NetFirewallRule -DisplayName 'RDP-3389-Any' -ErrorAction SilentlyContinue)) {
            New-NetFirewallRule -DisplayName 'RDP-3389-Any' -Direction Inbound -Protocol TCP `
              -LocalPort 3389 -Action Allow -Profile Any | Out-Null
          }

          Write-Host "::notice::RDP user ready: $user"

      - name: Install Tailscale and join your tailnet
        shell: pwsh
        env:
          GH_RUN_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Join-Path $env:RUNNER_TEMP 'tailscale.msi'
          Invoke-WebRequest 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi' `
            -OutFile $msi -UseBasicParsing
          Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart TS_UNATTENDEDMODE=1" -Wait

          $ts = 'C:\Program Files\Tailscale\tailscale.exe'
          if (-not (Test-Path $ts)) { throw 'Tailscale was not installed.' }

          $ok = $false
          for ($i = 0; $i -lt 6 -and -not $ok; $i++) {
            & $ts up --authkey=$env:TS_AUTHKEY --hostname=$env:TS_HOSTNAME --unattended --accept-routes 2>&1 | Write-Host
            if ($LASTEXITCODE -eq 0) { $ok = $true } else { Start-Sleep -Seconds 10 }
          }
          if (-not $ok) { throw 'tailscale up failed.' }

          $ip = ''
          for ($i = 0; $i -lt 24; $i++) {
            $ip = (& $ts ip -4 2>$null | Select-Object -First 1)
            if ($ip) { break }
            Start-Sleep -Seconds 5
          }
          if (-not $ip) { throw 'No Tailscale IP assigned.' }
          $ip = $ip.Trim()

          if (-not [string]::IsNullOrWhiteSpace($env:GH_RUN_TOKEN)) {
            try {
              $statusBody = @{
                state       = "success"
                context     = "vps-ip-$($env:GITHUB_RUN_ID)"
                description = "$ip"
              } | ConvertTo-Json -Compress
              $headers = @{
                Authorization = "Bearer $($env:GH_RUN_TOKEN)"
                Accept        = "application/vnd.github+json"
              }
              Invoke-RestMethod -Method Post -Uri "$($env:GITHUB_API_URL)/repos/$($env:GITHUB_REPOSITORY)/statuses/$($env:GITHUB_SHA)" -Headers $headers -Body $statusBody -ContentType "application/json" | Out-Null
            } catch {
              Write-Host "Status publish skipped: $_"
            }
          }

          & $ts status
          Write-Host ''
          Write-Host "::notice::TAILSCALE_IP=$ip"
          Write-Host "=============================================="
          Write-Host " TAILSCALE_IP=$ip"
          Write-Host " RDP_USER=$env:RDP_USER"
          Write-Host " HOSTNAME=$env:COMPUTERNAME"
          Write-Host "=============================================="

      - name: Inject Setup Scripts on Desktop
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'C:\vps' | Out-Null
          New-Item -ItemType Directory -Force -Path 'C:\Users\vps\Desktop' | Out-Null
          New-Item -ItemType Directory -Force -Path 'C:\Users\Public\Desktop' | Out-Null

          [System.IO.File]::WriteAllBytes('C:\vps\setup_vps.ps1', [System.Convert]::FromBase64String(''))
          [System.IO.File]::WriteAllBytes('C:\vps\Setup_VPS.bat', [System.Convert]::FromBase64String(''))
          Copy-Item 'C:\vps\Setup_VPS.bat' 'C:\Users\vps\Desktop\Setup_VPS.bat' -Force -ErrorAction SilentlyContinue
          Copy-Item 'C:\vps\Setup_VPS.bat' 'C:\Users\Public\Desktop\Setup_VPS.bat' -Force -ErrorAction SilentlyContinue

          Write-Host "::notice::Setup scripts ready on Desktop."

      - name: Show machine specs
        shell: pwsh
        run: |
          Get-CimInstance Win32_Processor | Select-Object Name,NumberOfCores,NumberOfLogicalProcessors | Format-List
          [math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory/1GB,1)
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,OSArchitecture | Format-List
          Get-PSDrive C | Select-Object Used,Free

      - name: Keep alive
        shell: pwsh
        run: |
          $end = (Get-Date).AddMinutes(320)
          $ts  = 'C:\Program Files\Tailscale\tailscale.exe'
          while ((Get-Date) -lt $end) {
            Start-Sleep -Seconds 60
            try { & $ts status --peers=false *> $null } catch { }
          }
          Write-Host 'Time budget finished - job will end.'
